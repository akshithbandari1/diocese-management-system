{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center vh-100">
    <div class="col-md-4">
        <div class="text-center mb-4">
            <h5 class="text-uppercase fw-bold" style="color: #32261d;">Diocese of St. Augustine</h5>
            <small class="text-muted">PARISH DATA CENTER</small>
        </div>
        <div class="card p-5 shadow">
            <h4 class="fw-bold mb-4">Login</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small text-muted">USERNAME</label>
                    <input type="text" name="username" class="form-control form-control-lg bg-light border-0" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-muted">PASSWORD</label>
                    <input type="password" name="password" class="form-control form-control-lg bg-light border-0" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-3 fw-bold shadow-sm" style="background-color: #32261d;">Login to System</button>
            </form>
            <div class="text-center mt-4">
                <a href="{{ url_for('register') }}" class="small text-muted text-decoration-none">Need an account? Request access</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
