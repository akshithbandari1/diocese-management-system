{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center vh-100">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <h5 class="text-uppercase fw-bold" style="color: #32261d;">Request Access</h5>
            <small class="text-muted">DIOCESE OF ST. AUGUSTINE PCDC</small>
        </div>
        <div class="card p-5 shadow border-0">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small text-muted fw-bold">USERNAME</label>
                    <input type="text" name="username" class="form-control bg-light border-0" placeholder="e.g. jdoe_parish" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted fw-bold">EMAIL ADDRESS</label>
                    <input type="email" name="email" class="form-control bg-light border-0" placeholder="name@example.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-muted fw-bold">CHOOSE PASSWORD</label>
                    <input type="password" name="password" class="form-control bg-light border-0" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-3 fw-bold shadow-sm" style="background-color: #32261d;">Submit Request</button>
            </form>
            <div class="text-center mt-4">
                <p class="small text-muted">Already have access? <a href="{{ url_for('login') }}" class="text-decoration-none" style="color: #c5a059;">Login here</a></p>
            </div>
        </div>
        <div class="alert alert-warning mt-4 small border-0 shadow-sm">
            <i class="bi bi-info-circle me-2"></i> All new accounts require manual approval by a System Administrator.
        </div>
    </div>
</div>
{% endblock %}
